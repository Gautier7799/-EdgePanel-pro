name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد بيئة Node.js 20
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. بناء ملف الـ APK وتجميعه
      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          CI: false
        run: |
          echo "=== 1. التحقق من مسار Android SDK المدمج في GitHub ==="
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # قبول التراخيص رسمياً إن لزم الأمر
          yes | sdkmanager --licenses || true

          # المسار الأول: إذا كان مشروع أندرويد قياسي
          if [ -f "./gradlew" ]; then
            echo "وجد ملف gradlew..."
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --stacktrace

          # المسار الثاني: إذا كان كود أندرويد داخل مجلد android
          elif [ -f "./android/gradlew" ]; then
            echo "وجد مجلد android مع gradlew..."
            cd android
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --stacktrace
            cd ..

          # المسار الثالث: مشروع ويب (React / Vite) - تحويله إلى APK أصلي
          elif [ -f "package.json" ]; then
            echo "مشروع ويب - جاري البناء وتوليد تطبيق أندرويد APK..."
            
            # تثبيت الحزم وبناء ملفات dist مع تخطي تعارضات npm
            npm install --legacy-peer-deps --no-audit
            npm run build

            # تثبيت كاباسيتور لتحويل كود الويب إلى تطبيق أندرويد
            npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps --no-audit
            
            # تهيئة منصة أندرويد
            if [ ! -d "android" ]; then
              npx cap init "EdgePanel Pro" "com.edgepanel.pro" --web-dir dist
              npx cap add android
            else
              npx cap sync android
            fi

            # كتابة مسار SDK في مجلد أندرويد وبناء الـ APK
            cd android
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --stacktrace
            cd ..
          fi

      # 5. رفع ملف الـ APK برابط تنزيل مباشر
      - name: Upload APK to Artifacts (تحميل مباشر)
        uses: actions/upload-artifact@v4
        with:
          name: EdgePanel-Pro-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/outputs/apk/**/*.apk
          retention-days: 30
