name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. سحب الكود
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد بيئة Node.js 22 (متوافقة تماماً مع Capacitor)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. قبول تراخيص Android SDK
      - name: Accept Android Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63cbd8249728252f587329407fb8264e\n89338d0d107204538aab477266a70a2a8a4e4521\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      # 5. بناء تطبيق الويب وتغليفه كـ APK
      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          CI: false
        run: |
          # 1. إذا وجد مشروع أندرويد قياسي
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --no-daemon --stacktrace

          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..

          # 2. بناء مشروع الويب
          elif [ -f "package.json" ]; then
            # تثبيت الحزم وتوليد ملفات dist
            npm install --legacy-peer-deps --force --no-audit
            npm run build

            # تثبيت capacitor
            npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev --legacy-peer-deps --force --no-audit

            # ضمان وجود ملف capacitor.config.json وحذف أي ملف ts متبقي
            echo '{"appId":"com.edgepanel.pro","appName":"EdgePanel Pro","webDir":"dist"}' > capacitor.config.json
            rm -f capacitor.config.ts

            # إضافة منصة أندرويد ومزامنتها
            if [ ! -d "android" ]; then
              npx cap add android
            fi
            npx cap sync android

            # بناء الـ APK عبر Gradle الداخلي
            cd android
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
          fi

      # 6. رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgePanel-Pro-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/outputs/apk/**/*.apk
          retention-days: 30
