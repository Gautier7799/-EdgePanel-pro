name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          echo "=== 1. فحص وتجهيز بناء تطبيق Android ==="
          
          # الحالة 1: إذا كان المشروع يحتوي على gradlew في المجلد الرئيسي
          if [ -f "./gradlew" ]; then
            echo "وجِد مشروع أندرويد قياسي مع gradlew..."
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --stacktrace
            
          # الحالة 2: إذا كان داخل مجلد android فرعي
          elif [ -f "./android/gradlew" ]; then
            echo "وجِد مجلد android مع gradlew..."
            cd android
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --stacktrace
            cd ..
            
          # الحالة 3: مشروع الويب (React / Vite) - نقوم ببنائه وحزمه إلى APK فوراً
          elif [ -f "package.json" ]; then
            echo "تم اكتشاف مشروع ويب. جاري التجهيز والبناء بحل تعارض التبعات..."
            
            # تثبيت الحزم مع تخطي تعارض الإصدارات
            npm install --legacy-peer-deps
            npm run build
            
            # تثبيت حزم كاباسيتور مع خيار legacy-peer-deps لتجنب الخطأ
            npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
            
            # تهيئة مشروع الأندرويد إذا لم يكن مهيأ مسبقاً
            if [ ! -d "android" ]; then
              npx cap init "EdgePanel Pro" "com.edgepanel.pro" --web-dir dist
              npx cap add android
            else
              npx cap sync android
            fi
            
            echo "بدء تجميع ملف الـ APK لنظام أندرويد..."
            cd android
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            ./gradlew assembleDebug --stacktrace
            cd ..
          else
            echo "خطأ: لم يتم العثور على ملفات المشروع"
            exit 1
          fi

      - name: Upload APK to Artifacts (تحميل مباشر)
        uses: actions/upload-artifact@v4
        with:
          name: EdgePanel-Pro-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/outputs/apk/**/*.apk
          retention-days: 30
